{% extends "base.html" %}
{% block title %}Sign in · AI Study Assistant{% endblock %}
{% block content %}
<main class="auth-shell">
  <section class="panel auth-panel">
    <div class="auth-mark">✦</div>
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Pick up where<br>you left off.</h1>
    <p class="auth-copy">Sign in to your private study space.</p>
    <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" maxlength="80" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
      <button class="button button-primary auth-submit" type="submit">Sign in <span>→</span></button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create your account</a></p>
  </section>
</main>
{% endblock %}
